name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: run every tests/ dir
        run: bash scripts/run_all_tests.sh

      - name: hook e2e coverage gate (positive + negative test per detector)
        run: python3 scripts/check_hook_test_coverage.py

      - name: skills three-harness install gate
        run: python3 scripts/check_skills_three_harnesses.py

      - name: ecosystem boundaries (engine/corpus/product)
        run: python3 scripts/check_ecosystem_boundaries.py

      - name: DORA-for-agents baseline present
        run: python3 scripts/check_dora_baseline.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: install ruff
        run: pip install ruff

      - name: ruff (real bugs only — undefined names, unused imports, syntax errors)
        run: ruff check . --select E9,F

      - name: shellcheck
        run: shellcheck install.sh
