[hooks.hedge-runs-prove-it]
mode = "stop"
why_mode = "attention"
summary = "Stops a hedge such as probably without a check."

[hooks.hedge-runs-prove-it.enforcement]
default = "hard"
capability = ["claude:Stop"]
evidence = ["command_output", "file_line", "test_result"]
override = "reason_required"

[hooks.agent-relay-attribution]
mode = "warn"
why_mode = "habit"
summary = "Notes a helper agent's claim passed on as fact."

[hooks.agent-launch-guard]
mode = "warn"
why_mode = "attention"
summary = "Warns when Agent/Task launches cross a configured session rate."
enabled_by = "CATSTACK_AGENT_LAUNCH_BUDGET"

[hooks.answer-overrides-menu]
mode = "warn"
why_mode = "habit"
summary = "Notes the user typed their own answer to a menu."

[hooks.ask-to-scope]
mode = "stop"
why_mode = "attention"
summary = "Stops a vague ask from being guessed; asks which one they mean."

[hooks.auto-pr]
mode = "warn"
why_mode = "habit"
summary = "Reminds the agent to publish catstack changes."

[hooks.bound-tool-result]
mode = "stop"
why_mode = "attention"
summary = "Sends shell commands through the output capture helper."

[hooks.bug-complaint-leak]
mode = "warn"
why_mode = "habit"
summary = "Adds a history checklist to a bug report."

[hooks.build-the-lever]
mode = "warn"
why_mode = "habit"
summary = "Suggests a script when many files are hand-edited."

[hooks.cat-mode-default]
mode = "warn"
why_mode = "habit"
worker = true
summary = "Applies the user's working style each turn."
enabled_by = "CATSTACK_CAT_MODE_DEFAULT"

[hooks.categorical-scope-guard]
mode = "stop"
why_mode = "outward"
summary = "Stops a change that covers only part of an all request."

[hooks.claimed-search-not-run]
mode = "warn"
why_mode = "attention"
summary = "Notes a cited history search that never ran."

[hooks.demo-freeze]
mode = "stop"
why_mode = "attention"
summary = "Stops edits to what the user is demoing."

[hooks.diu-stop]
mode = "stop"
why_mode = "attention"
summary = "Stops a reply that is too long or unproven."
rule_modes = { "diu-stop.comment-reply-length" = "warn", "diu-stop.comment-reply-jargon" = "warn", "diu-stop.comment-reply-rewritten" = "warn" }

[hooks.explicit-failures]
mode = "warn"
why_mode = "habit"
summary = "Warns about code that hides errors."

[hooks.external-claim-gate]
mode = "stop"
why_mode = "outward"
summary = "Stops an unproven cause or fix posted to GitHub."

[hooks.fanout-routing-guard]
mode = "stop"
why_mode = "outward"
summary = "Blocks unrouted subagents that may push."

[hooks.fork-hook-skill-work]
mode = "warn"
why_mode = "habit"
summary = "Nudges hook and skill edits into their own XIRP session."

[hooks.frustration-watchdog]
mode = "stop"
why_mode = "attention"
summary = "Stops a reply that leaves an impatient user waiting."

[hooks.gate-blame-needs-evidence]
mode = "stop"
why_mode = "attention"
summary = "Stops blaming a hook without reading it."

[hooks.gh-write-verification]
mode = "stop"
why_mode = "outward"
summary = "Stops claiming a GitHub change happened without looking."

[hooks.history-before-reversal]
mode = "stop"
why_mode = "attention"
summary = "Stops a git revert before the history is read."

[hooks.handback-needs-attempt]
mode = "warn"
why_mode = "habit"
summary = "Notes a hand-off asking the user to run a step the agent never tried."
enabled_by = "CATSTACK_REFLECT_ENFORCEMENT"

[hooks.handoff-needs-smoke-test]
mode = "stop"
why_mode = "attention"
summary = "Stops handing the user a script nobody ran."

[hooks.hook-freshness]
mode = "warn"
why_mode = "attention"
summary = "Notes that installed hooks are behind."
target_mode = "stop-on-deleted"
rule_modes = { "hook-freshness.deleted-installed-hook" = "stop" }

[hooks.hook-health]
mode = "warn"
why_mode = "habit"
summary = "Notes hooks that crashed."

[hooks.incidence-needs-repetition]
mode = "stop"
why_mode = "attention"
summary = "Catches an always claim backed by one run."

[hooks.llm-judge]
mode = "warn"
why_mode = "habit"
summary = "Shared model check that other hooks call."

[hooks.named-verb-guard]
mode = "warn"
why_mode = "attention"
summary = "Catches a reply missing proof the user asked for."
target_mode = "stop"

[hooks.narrow-the-scope]
mode = "warn"
why_mode = "habit"
summary = "Warns about many edits with no check run."

[hooks.narrow-the-scope.enforcement]
default = "soft"
escalate = { when = "same_error_count >= 3", to = "hard" }
capability = ["claude:PostToolUse"]
evidence = ["edit_count", "check_command"]
override = "reason_required"

[hooks.new-file-callout]
mode = "stop"
why_mode = "attention"
summary = "Stops a reply that leaves new top-level files unmentioned."

[hooks.docstring-shape]
mode = "stop"
why_mode = "outward"
summary = "Stops multi-line or long docstrings outside a class."

[hooks.short-name]
mode = "stop"
why_mode = "outward"
summary = "Stops abbreviated or two-letter names in new code."

[hooks.no-comments]
mode = "stop"
why_mode = "outward"
summary = "Stops adding code comments."

[hooks.no-new-github-repo]
mode = "stop"
why_mode = "outward"
summary = "Stops creating a GitHub repository from this machine."

[hooks.plan-discipline]
mode = "off"
why_mode = "habit"
summary = "Planned hook with no code yet."

[hooks.playbook-router]
mode = "warn"
why_mode = "habit"
summary = "Adds the steps of a named playbook."

[hooks.pr-schema-gate]
mode = "warn"
why_mode = "habit"
summary = "Notes PR text that breaks the repo format."

[hooks.prove-it-ship-gate]
mode = "stop"
why_mode = "attention"
summary = "Stops deployed or live claims without proof."

[hooks.prove-it-ship-gate.enforcement]
default = "hard"
capability = ["claude:Stop", "cursor:stop", "codex:Stop"]
evidence = ["command_output", "artifact_reference"]
override = "reason_required"

[hooks.publish-act-guard]
mode = "stop"
why_mode = "outward"
summary = "Stops publishing from a helper agent."

[hooks.reflect-on-thrash]
mode = "warn"
why_mode = "habit"
summary = "Suggests a reflect pass when a session goes in circles."
enabled_by = "CATSTACK_REFLECT_ENFORCEMENT"

[hooks.reflect-quiet-output]
mode = "stop"
why_mode = "attention"
summary = "Stops a reflect pass from printing its findings in chat instead of the PR body."

[hooks.repeat-deny-stop]
mode = "warn"
why_mode = "habit"
summary = "Notes the same action blocked twice."

[hooks.repeat-error-stop]
mode = "warn"
why_mode = "habit"
summary = "Catches the same failure three times with nothing changed."

[hooks.repeat-error-stop.enforcement]
default = "conditional"
escalate = { when = "same_error_count >= 3", to = "hard" }
capability = [
  "claude:PreToolUse",
  "claude:PostToolUse",
  "claude:PostToolUseFailure",
  "cursor:preToolUse",
  "cursor:postToolUse",
  "codex:PreToolUse",
  "codex:PostToolUse",
]
evidence = ["error_signature", "command"]
override = "reason_required"

[hooks.restart-risk-check]
mode = "stop"
why_mode = "attention"
summary = "Stops a safe-to-restart claim without load checks."

[hooks.restated-constraint]
mode = "warn"
why_mode = "habit"
summary = "Notes that the user repeated an earlier rule."

[hooks.runbook-gate]
mode = "off"
why_mode = "habit"
summary = "Records how each step of a routed playbook ended; never speaks."

[hooks.scope-lock]
mode = "stop"
why_mode = "attention"
summary = "Stops drift after the user narrowed the task twice."
enabled_by = "CATSTACK_REFLECT_ENFORCEMENT"
rule_modes = { "scope-lock.prompt-instruction" = "warn", "scope-lock.reflection-acknowledged" = "warn" }

[hooks.spreadsheet-completeness-guard]
mode = "stop"
why_mode = "attention"
summary = "Blocks spreadsheet completion claims without source-backed entity coverage."

[hooks.scratchpad-collision]
mode = "stop"
why_mode = "outward"
summary = "Stops two agents writing one temp file."

[hooks.serial-option-guard]
mode = "stop"
why_mode = "attention"
summary = "Stops recommending many PR stacks one at a time here."

[hooks.skill-usage-log]
mode = "off"
why_mode = "habit"
summary = "Records each skill use for metrics; never speaks."

[hooks.split-scope]
mode = "warn"
why_mode = "habit"
summary = "Reminds the agent to split multi-PR work."

[hooks.technical-writing-guard]
mode = "stop"
why_mode = "attention"
summary = "Stops a document rewrite that fails the sentence checks."

[hooks.text-match-decision-warn]
mode = "warn"
why_mode = "habit"
summary = "Notes new code that decides by matching text."

[hooks.ui-input-guard]
mode = "stop"
why_mode = "outward"
summary = "Stops driving the user's keyboard or screen."

[hooks.unverified-tag-check]
mode = "off"
why_mode = "habit"
summary = "Checks each CAT-UNVERIFIED excuse in the background; no code yet."

[hooks.unverified-tag-ledger]
mode = "stop"
why_mode = "attention"
summary = "Stops when unchecked claims pile up."
enabled_by = "CATSTACK_UNVERIFIED_TAG_BEHAVIOR"

[hooks.user-did-it]
mode = "warn"
why_mode = "habit"
summary = "Notes a step the user did by hand that the agent could have done."
enabled_by = "CATSTACK_REFLECT_ENFORCEMENT"

[hooks.verdict-flip-watch]
mode = "warn"
why_mode = "habit"
summary = "Notes a check that passed earlier and failed later."
enabled_by = "CATSTACK_REFLECT_ENFORCEMENT"

[hooks.wait-needs-wakeup]
mode = "stop"
why_mode = "attention"
worker = true
summary = "Stops waiting language with no time or wake-up set, foreground poll loops, and wakeups past the per-session wake budget."

[hooks.wrong-check-reflect]
mode = "warn"
why_mode = "habit"
summary = "Suggests reflect after a claim is taken back."
enabled_by = "CATSTACK_REFLECT_ENFORCEMENT"

[thresholds]
min_closed_findings = 30
promote_max_ignore_rate = 0.02
demote_min_ignore_rate = 0.10
review_min_ignore_rate = 0.50
review_min_unchecked_rate = 0.05
followup_window_checks = 3
