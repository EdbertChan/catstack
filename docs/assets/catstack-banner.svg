  <rect width="1280" height="320" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="320" fill="none" stroke="#21262d" stroke-width="2"/>

  <!-- stacked layers -->
  <g transform="translate(96,88)">
    <rect x="18" y="0" width="168" height="36" rx="8" fill="#21262d" stroke="#e3b341" stroke-width="1.5"/>
    <rect x="9" y="44" width="186" height="36" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="1.5"/>
    <rect x="0" y="88" width="204" height="36" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  </g>

  <text x="360" y="148" fill="#f0f6fc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="72" font-weight="700">catstack</text>
  <text x="360" y="198" fill="#8b949e" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Claude · Cursor · Codex  one install, one source of truth</text>
